{% load static %}<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %} · Cream</title>
    <link rel="stylesheet" href="{% static 'vendor/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/tom-select.bootstrap5.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/cream.css' %}">
  </head>
  <body>
    <div class="d-flex">
      <nav class="app-sidebar offcanvas-lg offcanvas-start" tabindex="-1"
           id="app-sidebar" aria-label="Huvudmeny">
        <div class="offcanvas-header d-lg-none">
          <a class="app-brand" href="/">
            <span class="brand-mark">&#9679;</span> Cream
          </a>
          <button type="button" class="btn-close btn-close-white"
                  data-bs-dismiss="offcanvas" data-bs-target="#app-sidebar"
                  aria-label="Stäng"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column p-3">
          <a class="app-brand d-none d-lg-block mb-4 px-2" href="/">
            <span class="brand-mark">&#9679;</span> Cream
          </a>
          <ul class="nav nav-pills flex-column gap-1">
            <li class="nav-item">
              <a class="nav-link{% if section == 'companies' %} active{% endif %}"
                 href="{% url 'company-list' %}">Företag</a>
            </li>
            <li class="nav-item">
              <a class="nav-link{% if section == 'candidates' %} active{% endif %}"
                 href="{% url 'candidate-list' %}">Kandidater</a>
            </li>
            <li class="nav-item">
              <a class="nav-link{% if section == 'pipeline' %} active{% endif %}"
                 href="{% url 'pipeline' %}">Pipeline</a>
            </li>
          </ul>
        </div>
      </nav>
      <div class="flex-grow-1 d-flex flex-column min-vh-100">
        <header class="app-header d-flex align-items-center px-4 py-2">
          <button type="button" class="btn d-lg-none border-0 p-0 fs-3 lh-1"
                  data-bs-toggle="offcanvas" data-bs-target="#app-sidebar"
                  aria-controls="app-sidebar" aria-label="Öppna meny">&#9776;</button>
          <div class="dropdown ms-auto">
            <button type="button" class="btn d-inline-flex align-items-center gap-2 border-0"
                    data-bs-toggle="dropdown" aria-expanded="false">
              <span class="app-avatar">{{ user.username|first|upper }}</span>
              <span>{{ user.username }}</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li>
                <form method="post" action="{% url 'logout' %}">
                  {% csrf_token %}
                  <button type="submit" class="dropdown-item">Logga ut</button>
                </form>
              </li>
            </ul>
          </div>
        </header>
        <main class="p-4">
          {% for message in messages %}
            <div class="alert alert-danger" role="alert">{{ message }}</div>
          {% endfor %}
          {% block content %}{% endblock %}
        </main>
      </div>
    </div>
    <script src="{% static 'vendor/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'vendor/tom-select.complete.min.js' %}"></script>
    <script src="{% static 'js/location_inputs.js' %}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
