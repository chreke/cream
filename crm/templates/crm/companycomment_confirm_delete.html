{% extends "crm/company_detail.html" %}

{% block title %}Ta bort kommentar{% endblock %}

{% block modal %}
  <div class="modal d-block" tabindex="-1" role="dialog"
       aria-labelledby="delete-comment-title">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0">
          <h2 class="modal-title h4" id="delete-comment-title">Ta bort kommentar</h2>
          <a class="btn-close" href="{% url 'company-detail' company.pk %}" aria-label="Stäng"></a>
        </div>
        <div class="modal-body">
          <p class="mb-0">
            Är du säker på att du vill ta bort kommentaren?
            Detta går inte att ångra.
          </p>
        </div>
        <div class="modal-footer border-0">
          <a class="btn btn-outline-secondary"
             href="{% url 'company-detail' company.pk %}">Avbryt</a>
          <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Ta bort</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-backdrop show"></div>
{% endblock %}
