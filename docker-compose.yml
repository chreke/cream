services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # The database always lives in the db service; override whatever
      # the env file says.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      # localhost only: nginx is the sole public entry. PORT (from
      # .env, default 8000) is the host port nginx proxies to.
      - "127.0.0.1:${PORT:-8000}:8000"
    volumes:
      # Uploaded resumes; served through Django auth, never by nginx.
      # Bind mounts under ./data keep all state in the deploy directory,
      # where the VPS's native backup can see it (and deploy rsyncs must
      # exclude it).
      - ./data/media:/app/media
    depends_on:
      db:
        condition: service_healthy

  db:
    # Official image; ICU-enabled, as required by the sv-SE-x-icu
    # collation on the name fields.
    image: postgres:17
    restart: unless-stopped
    env_file: .env  # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
