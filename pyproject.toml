[project]
name = "cream"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django~=5.2.0",
    "gunicorn>=26.0.0",
    "markdown>=3.10.2",
    "psycopg[binary]>=3.3.4",
    "pymdown-extensions>=11.0.1",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-types>=0.24.0",
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "cream.settings"
python_files = ["tests.py", "test_*.py"]

[tool.pyright]
venvPath = "."
venv = ".venv"
# django-types can't type dynamic ORM attributes (FK `_id` fields,
# `self.object` on unparametrized generic CBVs, QuerySet.as_manager()),
# so this rule is all false positives here.
reportAttributeAccessIssue = false
